<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#761946">
<title>Une question pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;

    --plum: #761946;
    --ink: #ffffff;
    --oui: #ee89d9;
    --non: #fdb9f6;
    --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;

    /* 1 unité = 1 pixel de la maquette (1080 x 605), mise à l'échelle de l'écran */
    --u: min(calc(100vw / 1080), calc(100vh / 605));
    --base: max(1.05rem, calc(var(--u) * 38.5));
    --step: max(.6rem, calc(var(--u) * 14));
  }
  @media (orientation: portrait) {
    :root { --u: calc(100vw / 620); }
  }

  *, *::before, *::after { box-sizing: inherit; }

  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--plum);
  }
  body {
    margin: 0;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: var(--plum);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: .11em;
  }
  [hidden] { display: none !important; }

  .screen { position: absolute; inset: 0; }

  /* Images posées sur le fond */
  .sticker {
    position: absolute;
    left: var(--l);
    top: var(--t);
    width: calc(var(--u) * var(--w));
    height: auto;
    border-radius: var(--rad, 1.5%);
    transform: translate(-50%, -50%) rotate(var(--r));
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .s-king  { --l: 52.5%;  --t: 17.9%; --w: 146.8; --r: 6.6deg; }
  .s-men   { --l: 78.6%;  --t: 29.1%; --w: 122;   --r: 17.7deg; --rad: 9%; }
  .s-coach { --l: 28%;    --t: 43.3%; --w: 145.4; --r: -14.5deg; }
  .s-tiny  { --l: 91.4%;  --t: 15.1%; --w: 53.2;  --r: 18deg; }
  .s-hola  { --l: 13%;    --t: 73.2%; --w: 167.3; --r: -21.1deg; }

  @media (orientation: portrait) {
    .s-king  { --l: 44%; --t: 14%; }
    .s-men   { --l: 80%; --t: 27%; }
    .s-coach { --l: 30%; --t: 63%; }
    .s-tiny  { --l: 88%; --t: 8%; }
    .s-hola  { --l: 20%; --t: 87%; }
  }

  /* Écran de la question */
  .question {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: 92%;
    margin: 0;
    text-align: center;
    font-size: var(--base);
    font-weight: 300;
    line-height: 1.45;
    text-wrap: balance;
  }
  .reaction {
    position: absolute;
    left: 50%;
    top: 57%;
    transform: translateX(-50%);
    width: 90%;
    margin: 0;
    text-align: center;
    font-size: max(.75rem, calc(var(--u) * 16));
    letter-spacing: .18em;
    color: var(--non);
    min-height: 1.5em;
  }
  .answers {
    --n: 0;
    position: absolute;
    left: 50%;
    top: 74.5%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: max(1.25rem, calc(var(--u) * 120));
  }

  .btn {
    margin: 0;
    padding: .3em .5em;
    border: 0;
    background: none;
    font: inherit;
    font-weight: 300;
    letter-spacing: inherit;
    text-transform: inherit;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }

  .oui {
    color: var(--oui);
    font-size: min(calc(var(--base) + var(--n) * var(--step)), 17vw);
    transition: font-size .5s cubic-bezier(.3, 1.4, .5, 1);
  }
  .oui.max { animation: beat 1.7s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.04); } }

  .non {
    color: var(--non);
    font-size: calc(var(--base) * (1 - var(--n) / 6));
    opacity: calc(1 - var(--n) * .1);
    transition: font-size .45s ease, opacity .45s ease;
  }
  .non.gone { display: none; }

  /* Écran final */
  .yes {
    position: absolute;
    left: 50%;
    top: 38.7%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-size: var(--base);
    font-weight: 300;
    white-space: nowrap;
  }
  .yes:focus { outline: none; }
  @keyframes appear { from { opacity: 0; } }
  @keyframes pop {
    from { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) scale(.55); }
  }
  .stage > * { animation: appear .8s ease both; }
  .stage > .answers { animation-delay: .3s; }
  .done .sticker { animation: pop .7s cubic-bezier(.3, 1.4, .5, 1) both; animation-delay: var(--d, 0s); }
  .done .s-king  { --d: .05s; }
  .done .s-men   { --d: .2s; }
  .done .s-coach { --d: .35s; }
  .done .yes  { animation: appear .8s ease .1s both; }
  .done .note { animation: appear .8s ease .7s both; }

  /* Zone de message */
  .note {
    position: absolute;
    left: 50%;
    top: 56%;
    transform: translateX(-50%);
    width: min(88vw, max(18rem, calc(var(--u) * 440)));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .6rem;
    text-transform: none;
    letter-spacing: .03em;
  }
  .note textarea {
    display: block;
    width: 100%;
    resize: none;
    margin: 0;
    padding: .8em 1em;
    border: 1px solid rgba(253, 185, 246, .55);
    border-radius: 10px;
    background: rgba(255, 255, 255, .06);
    color: var(--ink);
    font: inherit;
    font-size: max(1rem, calc(var(--u) * 20));
    font-weight: 300;
    line-height: 1.5;
    letter-spacing: inherit;
    text-transform: none;
  }
  .note textarea::placeholder { color: rgba(253, 185, 246, .8); opacity: 1; }
  .note textarea:focus-visible { outline: 2px solid var(--non); outline-offset: 3px; }
  .send, .copy { color: var(--oui); }
  .send { font-size: max(.9rem, calc(var(--u) * 22)); text-transform: uppercase; letter-spacing: .11em; }
  .copy { font-size: max(.75rem, calc(var(--u) * 15)); text-transform: uppercase; letter-spacing: .14em; color: var(--non); }
  .status {
    margin: 0;
    min-height: 1.4em;
    text-align: center;
    font-size: max(.75rem, calc(var(--u) * 15));
    text-transform: uppercase;
    letter-spacing: .14em;
    line-height: 1.5;
    color: var(--non);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (orientation: portrait) {
    .question { top: 38%; }
    .reaction { top: 50%; }
    .answers  { top: 62%; }
    .yes      { top: 36%; }
    .note     { top: 44%; }
    .done .s-king  { --l: 44%; --t: 12%; }
    .done .s-men   { --l: 80%; --t: 24%; }
    .done .s-coach { --l: 26%; --t: 84%; }
  }
  @media (orientation: landscape) {
    .note { top: 54%; }
    .note textarea { height: 4.6em; }
  }
  @media (max-height: 460px) and (orientation: landscape) {
    .note { top: 52%; }
    .note textarea { height: 3.4em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  <h2 class="yes" id="yes" tabindex="-1">Yessss!</h2>

  <div class="note">
    <label class="sr-only" for="msg">Ton message</label>
    <textarea id="msg" rows="3" maxlength="500" placeholder="Écris-moi un petit message…"></textarea>
    <button class="btn send" id="send" type="button">Envoyer</button>
    <button class="btn copy" id="copy" type="button" hidden>Copier le message</button>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
</div>

<script>
  // Écris son prénom ici pour personnaliser la question (laisse vide sinon).
  var PRENOM = "";

  // Où recevoir son message : remplis UN seul champ.
  //  whatsapp : numéro avec indicatif, sans + (ex. "33612345678")
  //  sms      : numéro (ex. "+33612345678")
  //  email    : adresse mail
  var CONTACT = { whatsapp: "", sms: "", email: "" };

  var STEPS = 6;
  var REACTIONS = [
    "Tu es sûre ?",
    "Réfléchis bien…",
    "Vraiment vraiment ?",
    "Le bouton Non commence à avoir peur…",
    "Dernière chance…",
    "Il ne reste qu’une réponse possible."
  ];

  var question = document.getElementById("question");
  var reaction = document.getElementById("reaction");
  var answers = document.getElementById("answers");
  var oui = document.getElementById("oui");
  var non = document.getElementById("non");
  var stage = document.getElementById("stage");
  var done = document.getElementById("done");
  var yes = document.getElementById("yes");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var n = 0;

  question.textContent = (PRENOM ? PRENOM + ", est-ce" : "Est-ce") + " que tu veux être ma copine?";

  non.addEventListener("click", function () {
    if (n >= STEPS) return;
    n++;
    answers.style.setProperty("--n", n);
    reaction.textContent = REACTIONS[n - 1];

    if (n >= STEPS) {
      oui.classList.add("max");
      var finish = function () {
        non.classList.add("gone");
        oui.focus({ preventScroll: true });
      };
      if (reduceMotion) finish(); else setTimeout(finish, 480);
    }
  });

  oui.addEventListener("click", function () {
    stage.hidden = true;
    done.hidden = false;
    yes.focus({ preventScroll: true });
  });

  /* ——— Message ——— */
  var box = document.getElementById("msg");
  var send = document.getElementById("send");
  var copyBtn = document.getElementById("copy");
  var statusEl = document.getElementById("status");

  function buildUrl(msg) {
    var text = encodeURIComponent(msg);
    if (CONTACT.whatsapp) return "https://wa.me/" + CONTACT.whatsapp.replace(/\D/g, "") + "?text=" + text;
    if (CONTACT.sms) return "sms:" + CONTACT.sms.replace(/[^\d+]/g, "") + "?&body=" + text;
    if (CONTACT.email) return "mailto:" + CONTACT.email + "?subject=" + encodeURIComponent("Ma réponse") + "&body=" + text;
    return "";
  }

  function openLink(url) {
    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function copyText(t) {
    function legacy() {
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;left:-9999px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return legacy(); });
    }
    return Promise.resolve(legacy());
  }

  function copyAndTell(msg) {
    copyText(msg).then(function (ok) {
      statusEl.textContent = ok
        ? "Message copié : colle-le dans votre conversation."
        : "Sélectionne ton message et copie-le pour me l’envoyer.";
    });
  }

  send.addEventListener("click", function () {
    var msg = box.value.trim();
    if (!msg) {
      statusEl.textContent = "Écris d’abord quelques mots.";
      box.focus();
      return;
    }
    var url = buildUrl(msg);
    if (url) {
      openLink(url);
      statusEl.textContent = "Ton message est prêt : il ne reste qu’à l’envoyer dans l’appli qui s’ouvre.";
      copyBtn.hidden = false;
    } else if (navigator.share) {
      statusEl.textContent = "Choisis à qui l’envoyer.";
      copyBtn.hidden = false;
      navigator.share({ text: msg }).catch(function (err) {
        if (!err || err.name !== "AbortError") copyAndTell(msg);
      });
    } else {
      copyAndTell(msg);
    }
  });

  copyBtn.addEventListener("click", function () {
    copyAndTell(box.value.trim());
  });
</script>
</body>
</html>
